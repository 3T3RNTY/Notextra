spring.datasource.url=jdbc:h2:mem:notextra;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.flyway.enabled=false

spring.docker.compose.enabled=false

notextra.security.jwt-secret=test-secret-key-with-enough-length-for-hmac
notextra.security.jwt-expiration-ms=3600000
notextra.security.refresh-expiration-ms=86400000
notextra.storage.endpoint=http://localhost:9000
notextra.storage.access-key=test
notextra.storage.secret-key=test
notextra.storage.bucket=test-bucket
notextra.ai.openai-api-key=

notextra.generation.queue=memory
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=\
org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
