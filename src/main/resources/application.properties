spring.application.name=notextra
server.port=8080

# Database (Spring Boot Docker Compose auto-wires these in local dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/notextra
spring.datasource.username=notextra
spring.datasource.password=notextra

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,modulith

# Object storage (MinIO / S3-compatible)
notextra.storage.endpoint=http://localhost:9000
notextra.storage.access-key=notextra
notextra.storage.secret-key=notextraminio
notextra.storage.bucket=notextra-media

# Redis (job queue / caching — wired in later modules)
notextra.redis.host=localhost
notextra.redis.port=6379

# AI providers (set via environment in production)
notextra.ai.openai-api-key=${OPENAI_API_KEY:}
